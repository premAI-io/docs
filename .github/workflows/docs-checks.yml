name: docs checks

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Build (MDX parse + static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # next build fails if any .mdx fails to parse or frontmatter is invalid,
        # so this also covers schema + parse validation.
        run: npm run build

  spell-check:
    name: Spell check (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cspell
        run: npm install -g cspell

      - name: Run cspell on docs
        run: cspell "**/*.mdx" --no-progress --no-summary --show-context
