name: deploy docs

# Builds the static site and deploys it to Cloudflare Pages (docs.fluso.ai).
#
# ── Required secrets ─────────────────────────────────────────────────────────
#   CLOUDFLARE_API_TOKEN   API token with the "Cloudflare Pages — Edit" permission.
#   CLOUDFLARE_ACCOUNT_ID  The Cloudflare account id that owns the Pages project.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=fluso-docs --branch=main
